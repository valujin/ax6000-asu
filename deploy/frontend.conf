# Dedicated origin gateway. No dependency on an API/mirror DNS name at startup.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log /dev/stdout combined;
    server_tokens off;
    default_type application/octet-stream;
    sendfile on;
    autoindex off;
    keepalive_timeout 15s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    map $request_uri $asu_backend {
        default "";
        ~^/66/ api66:8000;
        ~^/612/recommended/ api612recommended:8000;
        ~^/612/latest/ api612latest:8000;
    }
    map $request_uri $asu_prefix {
        default "";
        ~^/66/ /66;
        ~^/612/recommended/ /612/recommended;
        ~^/612/latest/ /612/latest;
    }
    map $http_x_forwarded_proto $asu_scheme {
        default $scheme;
        https https;
        http http;
    }
    # Reject encoded separators/dot segments before NGINX's normalized URI can
    # turn a different request spelling into an immutable object or API route.
    map $request_uri $unsafe_path {
        default 0;
        "~*^[^?]*(%2e|%2f|%5c|%25)" 1;
        "~^[^?]*/[.][.]?(/|[?]|$)" 1;
    }
    map "$uri:$status" $asu_cache_control {
        default no-store;
        "~^/immutable/.*:(?:200|206|304)$" "public, max-age=31536000, immutable";
    }
    map $request_method $asu_build_peer {
        default "";
        POST $binary_remote_addr;
    }
    # Without explicit trusted real-IP configuration this bounds each proxy
    # peer (including the shared NPM peer), never a spoofable client header.
    limit_req_zone $binary_remote_addr zone=asu_metadata:1m rate=5r/s;
    limit_req_zone $asu_build_peer zone=asu_builds:1m rate=2r/m;
    limit_conn_zone $binary_remote_addr zone=asu_streams:1m;

    server {
        listen 8080;
        server_name asu.ezon.by;
        absolute_redirect off;
        client_max_body_size 256k;
        client_body_timeout 15s;
        client_header_timeout 15s;
        send_timeout 180s;
        max_ranges 1;
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=asu_metadata burst=20 nodelay;
        limit_conn asu_streams 4;

        if ($unsafe_path) { return 400; }
        if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }
        if ($request_method = OPTIONS) { return 204; }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Type, ETag, Last-Modified, X-Imagebuilder-Status, X-Queue-Position" always;
        add_header Access-Control-Max-Age "600" always;
        add_header Cache-Control $asu_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $asu_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix $asu_prefix;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_redirect ~^https?://[^/]+(/.*)$ $asu_prefix$1;
        proxy_redirect ~^(/.*)$ $asu_prefix$1;

        location = / {
            default_type application/json;
            return 200 '{"service":"ax6000-asu","cohorts":["/66/","/612/recommended/","/612/latest/"]}\n';
        }
        location = /healthz {
            default_type application/json;
            return 200 '{"service":"ax6000-asu-front","status":"ok"}\n';
        }
        location ~ "^/(?:66|612/(?:recommended|latest))/?$" {
            default_type application/json;
            return 200 '{"service":"ax6000-asu","api":"api/v1","metadata":"json/v1"}\n';
        }

        # A public frozen index/APK always goes through the independently pinned
        # mirror. Its path is unchanged; clients cannot supply an origin URL.
        location ~ "^/immutable/[a-f0-9]{64}/public/[a-f0-9]{64}/(?:base|luci|packages|routing|telephony|video)/[A-Za-z0-9][A-Za-z0-9_.+~-]*$" {
            if ($request_method = POST) { return 405; }
            set $mirror_backend immutable_mirror:8000;
            proxy_read_timeout 180s;
            proxy_pass http://$mirror_backend$uri$is_args$args;
        }
        # Static path components each begin with an alphanumeric character.
        # Neither dot segments, directory listings nor symlink escapes match.
        location ~ "^/immutable/[a-f0-9]{64}/channel/(?:[A-Za-z0-9][A-Za-z0-9_.+~-]*/)*[A-Za-z0-9][A-Za-z0-9_.+~-]*$" {
            if ($request_method = POST) { return 405; }
            root /;
            disable_symlinks on;
            try_files $uri =404;
        }
        location /immutable/ { return 404; }

        location ~ "^/(?:66|612/(?:recommended|latest))/store/[A-Za-z0-9][A-Za-z0-9_./+~-]*$" {
            if ($request_method = POST) { return 405; }
            rewrite "^/(?:66|612/(?:recommended|latest))(/.*)$" $1 break;
            proxy_read_timeout 180s;
            proxy_pass http://$asu_backend$uri$is_args$args;
        }
        location ~ "^/(?:66|612/(?:recommended|latest))/api/v1/build(?:/|$)" {
            limit_req zone=asu_metadata burst=20 nodelay;
            limit_req zone=asu_builds burst=2 nodelay;
            rewrite "^/(?:66|612/(?:recommended|latest))(/.*)$" $1 break;
            proxy_pass http://$asu_backend$uri$is_args$args;
        }
        location ~ "^/(?:66|612/(?:recommended|latest))/(?:api/v1|json/v1)/" {
            rewrite "^/(?:66|612/(?:recommended|latest))(/.*)$" $1 break;
            proxy_pass http://$asu_backend$uri$is_args$args;
        }
        location / { return 404; }
    }
}
